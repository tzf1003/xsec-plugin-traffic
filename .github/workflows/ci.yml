name: Plugin source validation

on:
  push:
    branches: [main, beta]
  pull_request:
    branches: [main, beta]

permissions:
  contents: read

jobs:
  manifest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 10.34.5
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24.19.0"
          cache: pnpm
      - name: Install exact dependencies
        run: pnpm install --frozen-lockfile
      - name: Verify source and generated frontend
        run: pnpm verify
      - name: Require generated frontend to match source
        run: git diff --exit-code -- plugins/com.xsec.workspace.traffic/com.xsec.desktop/frontend/index.js
      - name: Require the dual plugin manifests
        run: |
          test -f plugins/com.xsec.workspace.traffic/plugin.json
          test -f plugins/com.xsec.workspace.traffic/.codex-plugin/plugin.json

  source-preflight:
    needs: manifest
    name: source-preflight / source-preflight
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - name: Validate the registered source manifest, release identity, and whitespace
        env:
          PLUGIN_ID: com.xsec.workspace.traffic
        run: |
          set -euo pipefail
          [[ "$PLUGIN_ID" =~ ^com\.xsec\.[a-z0-9.-]+$ ]] || { echo "plugin_id is not a first-party XSEC identifier." >&2; exit 1; }
          manifest="plugins/${PLUGIN_ID}/plugin.json"
          [ -f "$manifest" ] || { echo "Registered source manifest is missing." >&2; exit 1; }
          node --input-type=module - "$manifest" "$PLUGIN_ID" <<'NODE'
          import { readFileSync } from "node:fs";
          const [manifestPath, expectedId] = process.argv.slice(2);
          const manifest = JSON.parse(readFileSync(manifestPath, "utf8"));
          if (manifest.name !== expectedId || typeof manifest.version !== "string" || !manifest.version) process.exit(1);
          const desktop = manifest.extensions?.["com.xsec.desktop"];
          if (!desktop || typeof desktop !== "object" || !desktop.engines || typeof desktop.engines !== "object") process.exit(1);
          NODE
          git diff --check HEAD^
